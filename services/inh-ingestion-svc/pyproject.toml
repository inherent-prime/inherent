[project]
name = "inh-ingestion-svc"
version = "0.5.0"
description = "Document ingestion service with multi-tenancy for processing and storing documents in PostgreSQL and Weaviate"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "inh-contracts",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "weaviate-client>=4.0.0",
    # Message queue (Valkey / Redis Streams)
    "redis>=5.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    # XLSX extraction (#118). Core (non-optional) dependency: the registry's
    # xlsx spec declares degradation="hard_fail" (the default), so this must
    # always be installed -- mirrors python-docx above, not the OCR pattern.
    "openpyxl>=3.1.0",
    # PPTX extraction (#119). Same OOXML family as python-docx; also a core
    # dependency for the same hard_fail reason as openpyxl above.
    "python-pptx>=1.0.0",
    # RTF extraction (#126) -- tiny, pure-Python, no C extensions or system
    # binaries, so it's a core dependency (like python-docx/pypdf above)
    # rather than an optional extra.
    "striprtf>=0.0.26,<0.1",
    # Charset detection for text extraction (#117) -- replaces
    # `errors="ignore"`, which silently DROPPED any non-UTF-8 byte instead of
    # decoding it, with a real best-guess decode of the file's actual encoding.
    "charset-normalizer>=3.3.0",
    "boto3>=1.34.0",
    "httpx>=0.25.0",
    # Used by operational scripts/ (migrate_schema, migrate_weaviate,
    # backfill_versions) to load .env — not imported by src/.
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    # Temporal for workflow orchestration
    "temporalio>=1.9.0",
    # Standalone HTTP API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Metrics
    "prometheus-client>=0.19.0",
    "motor>=3.7.1",
]

[project.optional-dependencies]
# Optional OCR support for PNG image uploads. Requires BOTH this extra and the
# 'tesseract' system binary (e.g. apt-get install tesseract-ocr). When absent,
# image extraction falls back gracefully to a placeholder (see extract.py).
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
]
# Dev tooling versions are normalized across all three services (M7 #21).
# See docs/developer/dependencies.md for the shared pin policy.
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "black==24.10.0",
    "ruff==0.14.10",
    "mypy==1.19.1",
    "bandit[toml]==1.9.3",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
inh-contracts = { path = "../inh-contracts" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Baselined [no-any-return] debt, tracked in #247. mypy started running for
# this service in CI (it previously ran for inh-public-api-svc only) and found
# 15 sites where a function annotated `-> str` / `-> bool` / `-> int` /
# `-> dict[str, Any]` returns an untyped value straight out of a stubless
# third-party client (weaviate, motor, boto3, temporal).
#
# `warn_return_any` is switched off HERE, per module, rather than globally the
# way inh-public-api-svc does it, so the rest of the service keeps the check
# and this list stays a punch-list: annotate/cast the returns in a module,
# then delete the module from `module` below. Every OTHER mypy check still
# runs on these modules -- only the Any-return warning is suppressed. When the
# list is empty, delete this whole block.
[[tool.mypy.overrides]]
module = [
    "src.api.ownership",             # 2
    "src.services.database",         # 1
    "src.services.embedder",         # 1
    "src.services.processor",        # 1
    "src.services.weaviate",         # 7
    "src.temporal.activities.extract",  # 1
    "src.temporal.activities.status",   # 2
]
warn_return_any = false

# Mirrors inh-public-api-svc's [tool.bandit] verbatim so all three services
# gate on the SAME severity threshold. CI invokes `bandit -c pyproject.toml -r
# src` (not `-ll`) everywhere: with a severity floor of MEDIUM here and LOW in
# public-api, an identical LOW finding would have failed one service and passed
# another. B101 is the one project-wide skip -- asserts are used as type
# narrowing in src/ and as, well, assertions in tests/.
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]  # Skip assert_used check (used in tests)

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing -m 'not compose'"
markers = [
    "failure_injection: intentional dependency-failure tests",
    "eval: fixture-backed extraction/chunking quality evaluations",
    "benchmark: latency/throughput benchmarks (loose SLO regression guards)",
    "compose: requires a running docker-compose stack (deselected by default)",
    "unit: fast isolated unit tests",
    "integration: tests that exercise real service dependencies",
    "slow: slow-running tests",
    "security: auth/tenancy security regression tests (offline)",
    "contract: schema/contract regression tests",
    # The PR-blocking end-to-end subset, run by .github/workflows/e2e-smoke.yml
    # as `-m "smoke and compose"`. Always combined with `compose`, never
    # selected alone: a smoke test is by definition one that needs the real
    # booted stack, and the pairing keeps the marker from silently widening
    # the merge gate if it is ever applied to an offline test. Keep this set
    # small -- everything tagged here is paid for on every pull request.
    "smoke: PR-blocking E2E smoke subset (always combined with compose)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/__pycache__/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

# Mirrors [project.optional-dependencies].dev so `uv sync --extra dev --group dev`
# resolves to the same normalized pins regardless of which flag is used (M7 #21).
[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "black==24.10.0",
    "ruff==0.14.10",
    "mypy==1.19.1",
    "bandit[toml]==1.9.3",
    "pre-commit>=3.6.0",
]
