# Generic test fixture pack's second (non-colliding) tool profile -- proves
# a name collision on ONE tool doesn't stop the pack's OTHER profiles from
# loading (inherent#392).
name: search_sections
description: >-
  Search the handbook's numbered sections for policy text relevant to a
  question. Returns matching section text with its section number and heading.
filters: [section_type, product]
default_limit: 3
max_limit: 10
