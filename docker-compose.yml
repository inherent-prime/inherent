services:
  postgres:
    image: postgres:15
    container_name: inherent-oss-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inherent-oss

  postgres-init:
    image: postgres:15
    container_name: inherent-oss-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./services/inh-ingestion-svc/scripts/migrations:/migrations:ro
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        PSQL="psql -h postgres -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_base} -v ON_ERROR_STOP=1"
        # Migration history table: each migration is applied exactly once. This
        # makes startup idempotent and non-destructive — the destructive DROPs in
        # 001/007 only ever run once on a fresh database, never on restart (#16).
        echo "Ensuring _migrations tracking table exists..."
        $$PSQL -q -c "CREATE TABLE IF NOT EXISTS _migrations (id SERIAL PRIMARY KEY, filename VARCHAR(255) NOT NULL UNIQUE, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"
        # Safety for pre-tracking databases: if the schema already exists but the
        # tracking table is empty, this DB was provisioned by the old blind loop.
        # Backfill the records WITHOUT re-running, so the upgrade itself cannot
        # trigger a destructive re-apply.
        schema_present=$$($$PSQL -tA -c "SELECT to_regclass('public.processed_documents') IS NOT NULL;")
        tracking_count=$$($$PSQL -tA -c "SELECT COUNT(*) FROM _migrations;")
        if [ "$$schema_present" = "t" ] && [ "$$tracking_count" = "0" ]; then
          echo "Existing schema with empty tracking detected; backfilling history without re-running."
          for migration in /migrations/*.sql; do
            $$PSQL -q -c "INSERT INTO _migrations (filename) VALUES ('$$(basename "$$migration")') ON CONFLICT (filename) DO NOTHING;"
          done
        fi
        for migration in /migrations/*.sql; do
          filename=$$(basename "$$migration")
          applied=$$($$PSQL -tA -c "SELECT 1 FROM _migrations WHERE filename = '$$filename';")
          if [ "$$applied" = "1" ]; then
            echo "Skipping (already applied): $$filename"
            continue
          fi
          echo "Applying $$filename"
          $$PSQL -f "$$migration"
          $$PSQL -q -c "INSERT INTO _migrations (filename) VALUES ('$$filename');"
        done
        echo "Migrations complete."
    networks:
      - inherent-oss
    restart: "no"

  mongodb:
    image: mongo:7
    container_name: inherent-oss-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inherent-oss

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: inherent-oss-weaviate
    restart: unless-stopped
    ports:
      - "18080:8080"
      - "15051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      # API-key auth (#3). Dev defaults the key for convenience; both services
      # authenticate with the same value.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-local-dev-weaviate-key}
      AUTHENTICATION_APIKEY_USERS: inherent@local
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: inherent@local
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inherent-oss

  valkey:
    image: valkey/valkey:8-alpine
    container_name: inherent-oss-valkey
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: valkey-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inherent-oss

  s3rver:
    image: node:20-alpine
    container_name: inherent-oss-s3rver
    restart: unless-stopped
    ports:
      - "19000:9000"
    # Pinned + --yes (#353): a bare `npx s3rver` resolves whatever npm serves
    # that day, so the S3 implementation under every E2E run could change with
    # no commit. Same class of drift as the image lockfile pinning in #225.
    command: npx --yes s3rver@3.7.1 -d /data -a 0.0.0.0 -p 9000 --no-vhost-buckets --configure-bucket inherent-documents
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000"]
      interval: 10s
      timeout: 5s
      # Same budget as text-embeddings-inference above, and for the same
      # reason: this container does network work before it can serve. It
      # installs s3rver from npm on every start, and the old 10s x 5 = 50s
      # left no room for it -- `up --wait` tore the whole stack down
      # mid-download on four unrelated branches in one morning (#353).
      # 90s + 12 x 10s = 210s, vs. the <50s the install historically took on
      # CI runners. This is a budget, not a cure: the install time is
      # unbounded (measured 423s on a cold local cache), so #353 tracks
      # baking s3rver into a published image and dropping the runtime
      # download entirely.
      retries: 12
      start_period: 90s
    networks:
      - inherent-oss

  text-embeddings-inference:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    platform: linux/amd64
    container_name: inherent-oss-tei
    restart: unless-stopped
    ports:
      - "18088:80"
    command:
      - "--model-id"
      - "${EMBEDDING_MODEL_ID:-BAAI/bge-small-en-v1.5}"
      - "--port"
      - "80"
    volumes:
      - tei_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - inherent-oss

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: inherent-oss-temporal
    restart: unless-stopped
    ports:
      - "17233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: default
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $(hostname -i):7233 cluster health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - inherent-oss

  temporal-ui:
    image: temporalio/ui:2.24.0
    container_name: inherent-oss-temporal-ui
    restart: unless-stopped
    ports:
      - "18233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    networks:
      - inherent-oss

  # auto-setup only registers "default" (#148). The ingestion audit worker
  # (settings.temporal_audit_namespace) dispatches to a separate namespace so
  # audit-log workflows don't compete with document-ingestion ones; register
  # it here, once, before the ingestion worker starts.
  temporal-init:
    image: temporalio/admin-tools:1.24.2-tctl-1.18.1-cli-1.0.0
    container_name: inherent-oss-temporal-init
    entrypoint: []
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_AUDIT_NAMESPACE: ${TEMPORAL_AUDIT_NAMESPACE:-audit}
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        # --namespace must precede the subcommand -- `namespace describe/register
        # <name>` silently ignores a trailing positional name and operates on
        # the default namespace instead, which made this check a false-positive
        # no-op (#148 follow-up: verified against a live cluster).
        if DESCRIBE_OUT=$$(tctl --address temporal:7233 --namespace "$$TEMPORAL_AUDIT_NAMESPACE" namespace describe 2>&1); then
          echo "Temporal namespace '$$TEMPORAL_AUDIT_NAMESPACE' already registered."
        elif echo "$$DESCRIBE_OUT" | grep -qi "notfound\|not found"; then
          echo "Registering Temporal namespace '$$TEMPORAL_AUDIT_NAMESPACE'..."
          tctl --address temporal:7233 --namespace "$$TEMPORAL_AUDIT_NAMESPACE" namespace register --retention 3
        else
          # Any other describe failure (network flake, version mismatch) must
          # NOT be treated as "missing" -- blindly registering on top of a
          # transient error could itself fail and permanently block ingestion
          # boot (service_completed_successfully never succeeds).
          echo "$$DESCRIBE_OUT" >&2
          echo "Temporal namespace describe failed for a reason other than 'not found' -- refusing to register blindly." >&2
          exit 1
        fi
    restart: "no"
    networks:
      - inherent-oss

  inh-ingestion-svc:
    build:
      # Build from the repo root so the sibling shared package
      # (services/inh-contracts) is visible to the build context.
      context: .
      dockerfile: services/inh-ingestion-svc/Dockerfile
    container_name: inherent-oss-ingestion
    restart: unless-stopped
    ports:
      - "18002:8000"
      - "19090:9090"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_base}
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-local-dev-weaviate-key}
      MQ_BACKEND: redis
      REDIS_URL: redis://valkey:6379
      STORAGE_BACKEND: s3
      STORAGE_BUCKET: ${AWS_S3_BUCKET:-inherent-documents}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-S3RVER}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-S3RVER}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: http://s3rver:9000
      SERVICE_MODE: worker
      TEMPORAL_ENABLED: "true"
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: document-ingestion
      TEMPORAL_AUDIT_NAMESPACE: ${TEMPORAL_AUDIT_NAMESPACE:-audit}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-dev-ingestion-key}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      EMBEDDING_ENABLED: "true"
      EMBEDDING_SERVICE_URL: http://text-embeddings-inference:80
      EMBEDDING_DIM: 384
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: main
      LOG_LEVEL: INFO
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      valkey:
        condition: service_healthy
      s3rver:
        condition: service_healthy
      temporal:
        condition: service_healthy
      temporal-init:
        condition: service_completed_successfully
      text-embeddings-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - inherent-oss

  inh-public-api-svc:
    build:
      # Build from the repo root so the sibling shared package
      # (services/inh-contracts) is visible to the build context.
      context: .
      dockerfile: services/inh-public-api-svc/Dockerfile
    container_name: inherent-oss-public-api
    restart: unless-stopped
    ports:
      - "18000:8080"
    environment:
      SERVICE_MODE: both
      PORT: 8080
      MCP_PORT: 8001
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_base}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: main
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-local-dev-weaviate-key}
      MQ_REDIS_URL: redis://valkey:6379
      REDIS_URL: redis://valkey:6379
      AWS_S3_ENDPOINT: http://s3rver:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-S3RVER}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-S3RVER}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-inherent-documents}
      AWS_S3_REGION: ${AWS_REGION:-us-east-1}
      EMBEDDING_SERVICE_URL: http://text-embeddings-inference:80
      EMBEDDING_DIM: 384
      # Rate limiting is ON by default for local/dev parity with the release
      # stack. CI's compose e2e (integration + retrieval evals + throughput
      # benchmarks) deliberately bursts far past any per-minute limit on the
      # single bootstrapped dev key, so it exports RATE_LIMIT_ENABLED=false to
      # exercise the ingestion→search path unthrottled. Rate-limit behavior has
      # its own offline coverage (tests/integration/test_rate_limiting.py).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Whole-stack listings are safe only on this local single-operator stack.
      ADMIN_API_ENABLED: "true"
      # On by default since 2026-08-06 (#146, see settings.py and
      # docs/advanced-indexes.md) -- this Compose default must track
      # settings.py's default or this env var silently overrides it and
      # every Compose/CI run (including the retrieval-eval gate) would keep
      # measuring the old, off, behavior even after the code default flips.
      # Exposed so local Compose runs can still measure the off path against
      # the golden corpus (tests/evals/) without editing this file:
      # `ENABLE_DIVERSIFICATION=false docker compose up -d --force-recreate
      # inh-public-api-svc`.
      ENABLE_DIVERSIFICATION: ${ENABLE_DIVERSIFICATION:-true}
      LOG_LEVEL: INFO
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      valkey:
        condition: service_healthy
      s3rver:
        condition: service_healthy
      text-embeddings-inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - inherent-oss

volumes:
  postgres_data:
  mongodb_data:
  weaviate_data:
  valkey_data:
  s3_data:
  tei_cache:

networks:
  inherent-oss:
    driver: bridge
