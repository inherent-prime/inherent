name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: every job here only reads the checked-out tree (the
# per-job summaries go to $GITHUB_STEP_SUMMARY, not to the API), so the
# workflow token never needs write access to contents, issues or checks.
permissions:
  contents: read

# One in-flight CI run per PR (or per branch on push). Superseded PR runs are
# cancelled so a rapid push sequence does not queue N redundant matrices;
# push-to-main runs are NOT cancelled, because `main`'s CI history is the
# merge-gate record for each commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only / agent-notes-only PRs (README, docs/, AGENTS.md, .memory/, ...)
  # cannot break the service matrix below, so they should not pay its cost
  # (Postgres service container + lint/format/typecheck/security/test/coverage
  # x3 services). A workflow-level `paths-ignore` would be the obvious fix, but
  # `service-checks`/`root-tests` are not themselves the registered required
  # check -- "Required tests before merge" is -- and skipping this workflow at
  # the trigger level would leave THAT check unregistered and the PR stuck
  # pending forever. Skipping at the job level instead keeps the workflow
  # (and the required check it produces) always triggering; a job that
  # evaluates its `if:` to false reports "skipped", which GitHub treats as a
  # passing state for a required check. `required-tests` below tolerates
  # "skipped" from both dependants for the same reason.
  changes:
    name: Detect software-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Push-to-main always runs the full suite -- see the concurrency comment
    # above ("main's CI history is the merge-gate record for each commit").
    # Skipping is a pull_request-only optimization.
    if: github.event_name == 'pull_request'
    outputs:
      software: ${{ steps.filter.outputs.software }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          echo "Changed files:" && cat changed.txt

          # An allowlist of paths that cannot affect the running software
          # system (docs content, standalone repo docs, agent/tooling notes),
          # not a denylist of what to run -- so a new top-level path defaults
          # to running the full suite rather than silently skipping it.
          # Kept in sync with the identical filter in e2e-smoke.yml.
          if grep -vqE '^(docs/|graphify-out/|\.memory/|\.superpowers/|\.remember/)|\.md$|^(LICENSE|CODEOWNERS|mkdocs\.yml|requirements-docs\.txt)$' changed.txt; then
            echo "software=true" >> "$GITHUB_OUTPUT"
          else
            echo "software=false" >> "$GITHUB_OUTPUT"
            echo "::notice::all changed files are docs/non-software paths -- skipping service-checks and root-tests"
          fi

  service-checks:
    name: ${{ matrix.service }} checks
    runs-on: ubuntu-latest
    needs: changes
    # `!= 'false'` (not `== 'true'`) so a skipped/failed `changes` job (e.g. a
    # transient git-fetch error) fails open into running the full suite
    # rather than silently skipping it.
    if: needs.changes.outputs.software != 'false'
    # A hung Postgres service container or a wedged pytest must not hold a
    # required merge gate "pending" for the runner's 6h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # cov_fail_under is the OVERALL per-service coverage floor enforced in
        # the Test step (each service's pyproject addopts already adds --cov).
        # Floors track actual coverage minus a 1-point buffer (floor(actual) -
        # 1) so run-to-run jitter (e.g. conditional imports) doesn't flake the
        # gate, and are raised whenever measured coverage improves -- they are
        # NEVER lowered. Per-core-module floors are enforced in the "Enforce
        # per-core-module coverage floors" step below and follow the same
        # policy -- see that step for the modules and floors.
        include:
          - service: inh-ingestion-svc
            path: services/inh-ingestion-svc
            python-version: "3.11"
            lint: uv run ruff check src tests
            format: uv run black --check src tests
            # mypy/bandit previously ran for public-api ONLY, so the largest
            # of the three services had no type or security signal at all.
            # The bandit invocation is byte-identical across all three so the
            # severity floor cannot differ between them. The findings that
            # were baselined to land this green are tracked in #247.
            typecheck: uv run mypy src
            security: uv run bandit -c pyproject.toml -r src
            test: uv run pytest
            # Actual measured on CI run 31661196233 (main@bc6d56b): 83.35%.
            # floor(83.35) - 1 = 82.
            cov_fail_under: 82
          - service: inh-public-api-svc
            path: services/inh-public-api-svc
            python-version: "3.11"
            lint: uv run ruff check src tests
            format: uv run black --check src tests
            typecheck: uv run mypy src
            security: uv run bandit -c pyproject.toml -r src
            test: uv run pytest
            # Actual measured on CI run 31661196233 (main@bc6d56b): 85.36%.
            # floor(85.36) - 1 = 84.
            cov_fail_under: 84
          # inh-contracts previously ran in NO automation (#132 item 4): a
          # change to a shared constant like DEFAULT_S3_REGION or the
          # Weaviate-naming derivation was caught by nothing, only a
          # one-sided drift downstream. No Postgres dependency; runs in <1s.
          - service: inh-contracts
            path: services/inh-contracts
            python-version: "3.11"
            lint: uv run ruff check src tests
            format: uv run black --check src tests
            # Clean under both today, with no baselined findings -- this is
            # the shared package every service imports, so it is the one
            # place a type or security regression propagates everywhere.
            typecheck: uv run mypy src
            security: uv run bandit -c pyproject.toml -r src
            test: uv run pytest
            # Actual measured on CI run 31661196233 (main@bc6d56b): 99.53%.
            # floor(99.53) - 1 = 98.
            cov_fail_under: 98

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_base
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group dev

      # inh-ingestion-svc's tests exercise real constraints (e.g.
      # fk_workspace_tenant, added by migration 012) that only the raw SQL
      # migrations create -- DatabaseService.ensure_schema()'s SQLAlchemy
      # metadata.create_all() does not declare them. Without this step CI's
      # Postgres schema structurally lacked constraints that dev/staging/prod
      # all have (provisioned via docker-compose.yml's postgres-init service
      # or the in-image `SERVICE_MODE=migrate` runner), so any test relying on
      # a migration-only constraint passed in CI regardless of whether it
      # actually held. Apply every migration in the same filename order those
      # two mirror (scripts/migrations/NNN_*.sql, ascending), failing loudly
      # (set -e + ON_ERROR_STOP=1) on the first error.
      - name: Apply DB migrations (ingestion schema fidelity)
        if: ${{ matrix.service == 'inh-ingestion-svc' }}
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in scripts/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d knowledge_base -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Lint
        run: ${{ matrix.lint }}

      - name: Format check
        run: ${{ matrix.format }}

      - name: Type check
        if: ${{ matrix.typecheck }}
        run: ${{ matrix.typecheck }}

      - name: Security check
        if: ${{ matrix.security }}
        run: ${{ matrix.security }}

      # Each service's pyproject [tool.pytest.ini_options] addopts already adds
      # --cov; here we enforce the overall coverage floor. Raise cov_fail_under
      # over time as the core modules listed in the matrix comment gain tests.
      - name: Test
        run: ${{ matrix.test }} --cov-fail-under=${{ matrix.cov_fail_under }}

      # Risk-based per-core-module coverage floors (#38). The Test step above
      # writes a .coverage file (pyproject addopts adds --cov); here we re-read
      # it and enforce a floor for each high-risk core module. POLICY: each
      # floor tracks floor(actual) - 1 (a 1-point buffer absorbs run-to-run
      # jitter, e.g. conditional imports) and is raised whenever measured
      # coverage improves -- floors are NEVER lowered. Per-module CI coverage
      # is >= the values measured locally because CI provides Postgres (some
      # tests skip locally without it); the values below are sourced from CI
      # run 31661196233 (main@bc6d56b, 2026-08-13).
      - name: Enforce per-core-module coverage floors (public-api)
        if: ${{ matrix.service == 'inh-public-api-svc' }}
        run: |
          uv run coverage report --include='src/services/auth.py' --fail-under=92
          uv run coverage report --include='src/services/search.py' --fail-under=87
          uv run coverage report --include='src/services/verify.py' --fail-under=99
          uv run coverage report --include='src/services/quality_gate.py' --fail-under=99

      - name: Enforce per-core-module coverage floors (ingestion)
        if: ${{ matrix.service == 'inh-ingestion-svc' }}
        run: |
          uv run coverage report --include='src/services/quality.py' --fail-under=99
          uv run coverage report --include='src/temporal/activities/extract.py' --fail-under=91
          uv run coverage report --include='src/temporal/activities/store.py' --fail-under=71
          uv run coverage report --include='src/temporal/activities/chunk.py' --fail-under=91

      # #205: this step used to run unconditionally under `if: always()` and
      # unconditionally echo a "checks passed" line -- so a red job (a failed
      # Lint/Format/Type/Security/Test step above) still printed a green
      # summary. `job.status` reflects the accumulated outcome of every step
      # that has already run in this job, so branching on it keeps
      # `always()` (the summary must still print when something upstream
      # failed) while making the printed line match reality either way.
      - name: Report check summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ${{ matrix.service }} checks passed :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${{ matrix.service }} checks failed :x:" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Root-level tests/ (#183): pins repo-root artifacts (docker-compose.yml's
  # init behavior, the initial migration) that don't belong to either
  # service. There is no root pyproject.toml/uv.lock -- these tests have no
  # project dependencies (stdlib pathlib only, reading files as text), so a
  # pinned ephemeral `uvx` pytest run is enough; no `uv sync`/venv needed.
  # Previously ran in NO workflow and NO Makefile target, so a regression in
  # the Postgres init script had no CI signal.
  root-tests:
    name: root tests/ (repo-level pins)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.software != 'false'
    # These tests read repo files with stdlib pathlib and run in seconds; the
    # only plausible way to exceed this is a wedged `uvx` resolve.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Matches the service-checks matrix's python-version pin, even though
      # this suite has no project of its own to sync.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Pin pytest's version to match the services' dev dependency (see
      # docs/developer/dependencies.md) instead of floating to whatever uvx
      # resolves latest, for reproducible runs.
      - name: Test
        run: uvx 'pytest==9.0.2' tests/ -q

      # #205: see the identical comment on service-checks' "Report check
      # summary" step -- same copy-pasted bug (added for #183), same fix.
      - name: Report check summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### root tests/ checks passed :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### root tests/ checks failed :x:" >> "$GITHUB_STEP_SUMMARY"
          fi

  required-tests:
    name: Required tests before merge
    runs-on: ubuntu-latest
    # This job is the required status check, so it must always reach a
    # terminal state rather than sitting pending behind a stuck dependency.
    timeout-minutes: 30
    needs:
      - service-checks
      - root-tests
    if: always()
    steps:
      # "skipped" is an accepted outcome alongside "success": both dependants
      # carry `if: needs.changes.outputs.software != 'false'`, so a docs-only
      # PR skips them deliberately (see the `changes` job above) rather than
      # failing.
      - name: Verify service checks passed
        run: |
          if [ "${{ needs.service-checks.result }}" != "success" ] && [ "${{ needs.service-checks.result }}" != "skipped" ]; then
            echo "::error::One or more service checks failed. Do not merge until CI is green."
            exit 1
          fi

          if [ "${{ needs.root-tests.result }}" != "success" ] && [ "${{ needs.root-tests.result }}" != "skipped" ]; then
            echo "::error::Root-level tests/ failed. Do not merge until CI is green."
            exit 1
          fi

          if [ "${{ needs.service-checks.result }}" = "skipped" ]; then
            echo "Service checks skipped -- PR touches only docs/non-software paths."
          else
            echo "All service checks passed."
          fi
