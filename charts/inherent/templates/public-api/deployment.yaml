{{- if .Values.publicApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inh-public-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inherent.labels" . | nindent 4 }}
    {{- include "inherent.selectorLabels" (dict "component" "public-api") | nindent 4 }}
spec:
  # Baseline replica count; the HPA (hpa.yaml) takes over scaling once
  # installed — this is only the initial/floor value on a fresh install.
  replicas: {{ .Values.publicApi.replicas.min }}
  selector:
    matchLabels:
      {{- include "inherent.selectorLabels" (dict "component" "public-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inherent.labels" . | nindent 8 }}
        {{- include "inherent.selectorLabels" (dict "component" "public-api") | nindent 8 }}
        {{- with .Values.serviceAccount.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "inherent.serviceAccountName" . }}
      containers:
        - name: public-api
          image: "{{ .Values.image.registry }}/public-api-svc:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.publicApi.containerPort }}
            - name: mcp
              containerPort: {{ .Values.publicApi.env.mcpPort }}
          env:
            - name: SERVICE_MODE
              value: {{ .Values.publicApi.env.serviceMode | quote }}
            - name: PORT
              value: {{ .Values.publicApi.containerPort | quote }}
            - name: MCP_PORT
              value: {{ .Values.publicApi.env.mcpPort | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.publicApi.env.environment | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres.name is required (DATABASE_URL) -- see values.yaml top-of-file REQUIRED values note" .Values.secrets.postgres.name }}
                  key: {{ .Values.secrets.postgres.key }}
            {{- if .Values.secrets.mongodb.name }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mongodb.name }}
                  key: {{ .Values.secrets.mongodb.key }}
            {{- end }}
            - name: MONGODB_DB_NAME
              value: {{ .Values.publicApi.env.mongodbDbName | quote }}
            - name: WEAVIATE_URL
              value: "http://weaviate:8080"
            - name: WEAVIATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.weaviate.name is required (WEAVIATE_API_KEY) -- see values.yaml top-of-file REQUIRED values note" .Values.secrets.weaviate.name }}
                  key: {{ .Values.secrets.weaviate.key }}
            {{- if .Values.secrets.redis.name }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redis.name }}
                  key: {{ .Values.secrets.redis.key }}
            - name: MQ_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redis.name }}
                  key: {{ .Values.secrets.redis.key }}
            {{- end }}
            - name: AWS_S3_ENDPOINT
              value: "http://minio:9000"
            {{- if .Values.secrets.s3.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.name }}
                  key: {{ .Values.secrets.s3.accessKeyField }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.name }}
                  key: {{ .Values.secrets.s3.secretKeyField }}
            {{- end }}
            - name: AWS_S3_BUCKET
              value: {{ .Values.publicApi.env.s3Bucket | quote }}
            - name: AWS_S3_REGION
              value: {{ .Values.publicApi.env.s3Region | quote }}
            {{- if eq .Values.embedding.profile "azure_openai" }}
            # DANGER — profile=azure_openai: this block sets
            # EMBEDDING_PROVIDER/EMBEDDING_API_KEY/EMBEDDING_MODEL_ID, but
            # the app does not read them yet (extra="ignore" in Settings;
            # requires #311/PR #314 to merge an openai_compatible provider).
            # Until that PR merges, the app still always speaks the TEI wire
            # protocol to EMBEDDING_SERVICE_URL below — this profile CANNOT
            # work today. tei (the values.yaml default) is the supported
            # profile. Kept here, gated, so the wiring is ready the moment
            # #314 merges — do not flip the default before then.
            - name: EMBEDDING_PROVIDER
              value: "openai_compatible"
            - name: EMBEDDING_SERVICE_URL
              value: {{ required "embedding.serviceUrl is required when embedding.profile=azure_openai -- see values.yaml top-of-file REQUIRED values note" .Values.embedding.serviceUrl | quote }}
            {{- if .Values.secrets.embeddingApiKey.name }}
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.embeddingApiKey.name }}
                  key: {{ .Values.secrets.embeddingApiKey.key }}
            {{- end }}
            - name: EMBEDDING_MODEL_ID
              value: {{ required "embedding.modelId is required when embedding.profile=azure_openai -- see values.yaml top-of-file REQUIRED values note" .Values.embedding.modelId | quote }}
            {{- else }}
            - name: EMBEDDING_SERVICE_URL
              value: "http://text-embeddings-inference:80"
            {{- end }}
            - name: EMBEDDING_DIM
              value: {{ .Values.embedding.dim | quote }}
            - name: RATE_LIMIT_ENABLED
              value: {{ .Values.publicApi.env.rateLimitEnabled | quote }}
            - name: TRUSTED_PROXIES
              # settings.py: trusted_proxies: list[str], parsed by
              # pydantic-settings via json.loads(env_var) — MUST be rendered
              # as a JSON array, not a bare string/CIDR (either of those
              # raises SettingsError at import time -> CrashLoopBackOff on
              # every pod, since `settings = get_settings()` runs at module
              # scope). See values.yaml's publicApi.env.trustedProxies
              # comment for the exact-IP-match caveat.
              value: {{ .Values.publicApi.env.trustedProxies | toJson | quote }}
            - name: ENABLE_HSTS
              value: {{ .Values.publicApi.env.enableHsts | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.publicApi.env.logLevel | quote }}
          resources:
            {{- toYaml .Values.publicApi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.publicApi.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.publicApi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.publicApi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.publicApi.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.publicApi.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.publicApi.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.publicApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.publicApi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.publicApi.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.publicApi.probes.readiness.failureThreshold }}
{{- end }}
