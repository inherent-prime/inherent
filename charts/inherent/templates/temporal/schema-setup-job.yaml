{{- if .Values.temporal.enabled }}
# Self-hosted temporalio/server (not auto-setup, per build spec) needs its
# PG schema created explicitly before the server Deployment can start —
# mirrors Temporal's documented manual setup (temporal-sql-tool
# create-database / setup-schema / update-schema), run once per DB
# (temporal, temporal_visibility) against admin-tools' baked-in schema
# files. NOTE for the integrator: temporal-sql-tool's exact idempotency
# behavior on a re-run against an already-migrated DB has not been verified
# against a live cluster in this session (no Azure creds) — the `|| true`
# guards below are a best-effort mirror of docker-compose.yml's
# temporal-init describe-before-register pattern; verify against a real
# apply before relying on it for a rerun-safe upgrade path.
apiVersion: batch/v1
kind: Job
metadata:
  name: inh-temporal-schema-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inherent.labels" . | nindent 4 }}
    {{- include "inherent.selectorLabels" (dict "component" "temporal-schema-setup") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "2" # after migrate (0) and bucket-init (1)
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "inherent.labels" . | nindent 8 }}
        {{- include "inherent.selectorLabels" (dict "component" "temporal-schema-setup") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: schema-setup
          image: "{{ .Values.temporal.adminTools.image.repository }}:{{ .Values.temporal.adminTools.image.tag }}"
          env:
            - name: POSTGRES_SEEDS
              value: {{ required "temporal.postgres.host is required" .Values.temporal.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.temporal.postgres.port | quote }}
            - name: POSTGRES_USER
              value: {{ required "temporal.postgres.user is required" .Values.temporal.postgres.user | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ required "temporal.postgres.passwordSecretRef.name is required" .Values.temporal.postgres.passwordSecretRef.name }}
                  key: {{ .Values.temporal.postgres.passwordSecretRef.key }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SQL_TOOL="temporal-sql-tool --plugin postgres12 --endpoint $POSTGRES_SEEDS --port $DB_PORT --user $POSTGRES_USER --password $POSTGRES_PWD"

              setup_db() {
                db_name="$1"
                schema_dir="$2"
                echo "=== $db_name ==="
                $SQL_TOOL --database "$db_name" create-database \
                  || echo "create-database: '$db_name' may already exist, continuing"
                $SQL_TOOL --database "$db_name" setup-schema -v 0.0 \
                  || echo "setup-schema: '$db_name' baseline may already be set, continuing"
                $SQL_TOOL --database "$db_name" update-schema -d "$schema_dir"
              }

              setup_db "{{ .Values.temporal.postgres.dbName }}" /etc/temporal/schema/postgresql/v96/temporal/versioned
              setup_db "{{ .Values.temporal.postgres.visibilityDbName }}" /etc/temporal/schema/postgresql/v96/visibility/versioned
{{- end }}
