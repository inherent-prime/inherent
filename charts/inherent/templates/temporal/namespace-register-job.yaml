{{- if .Values.temporal.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: inh-temporal-namespace-register
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inherent.labels" . | nindent 4 }}
    {{- include "inherent.selectorLabels" (dict "component" "temporal-namespace-register") | nindent 4 }}
  annotations:
    # post-install/post-upgrade, NOT pre-install: this Job talks to
    # temporal:7233, which doesn't exist until the temporal Deployment (an
    # ordinary chart resource) has been created and become Ready — same
    # reasoning as templates/minio/bucket-init-job.yaml. Relies on
    # modules/apps' helm_release running with wait=true.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1" # after bucket-init (0); independent of it, just kept deterministic
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "inherent.labels" . | nindent 8 }}
        {{- include "inherent.selectorLabels" (dict "component" "temporal-namespace-register") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: namespace-register
          image: "{{ .Values.temporal.adminTools.image.repository }}:{{ .Values.temporal.adminTools.image.tag }}"
          # entrypoint: [] mirrors docker-compose.yml's temporal-init — the
          # admin-tools image's default entrypoint isn't a plain shell.
          command:
            - /bin/sh
            - -lc
            - |
              set -e
              # Wait for the frontend gRPC port to accept connections before
              # the first `tctl` call — belt-and-braces alongside
              # helm_release's wait=true (see hook annotation above).
              for i in $(seq 1 30); do
                (echo > /dev/tcp/temporal/7233) >/dev/null 2>&1 && break
                echo "waiting for temporal:7233..."; sleep 2
              done

              # Mirrors docker-compose.yml's temporal-init exactly (#148):
              # describe-before-register, and refuse to blindly register on
              # top of a non-"not found" describe failure (network flake /
              # version mismatch must not be treated as "missing" — that
              # could itself fail and permanently block this Job).
              {{- range .Values.temporal.namespaces }}
              NS="{{ . }}"
              if DESCRIBE_OUT=$(tctl --address temporal:7233 --namespace "$NS" namespace describe 2>&1); then
                echo "Temporal namespace '$NS' already registered."
              elif echo "$DESCRIBE_OUT" | grep -qi "notfound\|not found"; then
                echo "Registering Temporal namespace '$NS'..."
                tctl --address temporal:7233 --namespace "$NS" namespace register --retention {{ $.Values.temporal.retentionDays }}
              else
                echo "$DESCRIBE_OUT" >&2
                echo "Temporal namespace describe failed for '$NS' for a reason other than 'not found' -- refusing to register blindly." >&2
                exit 1
              fi
              {{- end }}
{{- end }}
