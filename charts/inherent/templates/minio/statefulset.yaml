{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inherent.labels" . | nindent 4 }}
    {{- include "inherent.selectorLabels" (dict "component" "minio") | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "inherent.selectorLabels" (dict "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inherent.labels" . | nindent 8 }}
        {{- include "inherent.selectorLabels" (dict "component" "minio") | nindent 8 }}
        {{- with .Values.serviceAccount.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "inherent.serviceAccountName" . }}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            {{- if .Values.secrets.s3.name }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.name }}
                  key: {{ .Values.secrets.s3.accessKeyField }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.name }}
                  key: {{ .Values.secrets.s3.secretKeyField }}
            {{- end }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # useZrsClass=true points this PVC at the SAME zone-redundant
        # StorageClass weaviate's STS uses (templates/storageclass.yaml,
        # shared/emitted once) instead of the zonal managed-csi-premium
        # default — see values.yaml's minio.persistence.useZrsClass comment.
        storageClassName: {{ .Values.minio.persistence.useZrsClass | ternary .Values.weaviate.persistence.zrsStorageClassName .Values.minio.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.sizeGi }}Gi
{{- end }}
