{{- if .Values.ingestion.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: inh-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inherent.labels" . | nindent 4 }}
    {{- include "inherent.selectorLabels" (dict "component" "migrate") | nindent 4 }}
  annotations:
    # Singleton DB migration, runs before every install/upgrade — see build
    # spec: "migrate runs as a Helm hook Job (singleton)". hook-delete-policy
    # clears the previous run's Job object so the (immutable) Job name can be
    # reused on the next upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "inherent.labels" . | nindent 8 }}
        {{- include "inherent.selectorLabels" (dict "component" "migrate") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inherent.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.registry }}/ingestion-svc:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE_MODE
              value: "migrate"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.postgres.name is required (DATABASE_URL)" .Values.secrets.postgres.name }}
                  key: {{ .Values.secrets.postgres.key }}
            # Required by the shared Settings model; migrate mode never
            # connects to Weaviate (matches docker-compose.release.yml's
            # postgres-init comment).
            - name: WEAVIATE_URL
              value: "http://weaviate:8080"
            - name: WEAVIATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.weaviate.name is required (WEAVIATE_API_KEY)" .Values.secrets.weaviate.name }}
                  key: {{ .Values.secrets.weaviate.key }}
            - name: LOG_LEVEL
              value: "INFO"
{{- end }}
