{{- if .Values.weaviate.persistence.createZrsStorageClass }}
# Premium_ZRS isn't one of AKS's built-in storage classes (only
# managed-csi / managed-csi-premium, both LRS) — needed for the enable_ha
# prod profile so weaviate's PV survives a single-zone outage. Set
# weaviate.persistence.createZrsStorageClass=true to render this and point
# weaviate.persistence.storageClassName is ignored in favor of
# weaviate.persistence.zrsStorageClassName in that case (see statefulset.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.weaviate.persistence.zrsStorageClassName }}
  labels:
    {{- include "inherent.labels" . | nindent 4 }}
provisioner: disk.csi.azure.com
parameters:
  skuname: Premium_ZRS
  cachingMode: ReadOnly
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# Retain, not Delete: this StorageClass backs the vector store's data disk —
# an accidental PVC/StatefulSet deletion must not silently drop the volume.
reclaimPolicy: Retain
{{- end }}
